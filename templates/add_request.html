{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0" style="border-top: 5px solid #ff6b6b;">
            <div class="card-header" style="background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);">
                <h3 class="m-0 text-center"><i class="fas fa-plus-circle"></i> Create Blood Request</h3>
            </div>
            <div class="card-body p-5">
                <form method="POST" novalidate>
                    <div class="mb-4">
                        <label for="patient_name" class="form-label"><i class="fas fa-user-injured"></i> Patient Name</label>
                        <input type="text" class="form-control form-control-lg" id="patient_name" name="patient_name" placeholder="Enter patient's full name" required style="border-radius: 10px;" autocomplete="off">
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-4">
                                <label for="blood_group" class="form-label"><i class="fas fa-droplet"></i> Blood Group Required</label>
                                <select class="form-select form-control-lg" id="blood_group" name="blood_group" required style="border-radius: 10px;">
                                    <option value="">Select Blood Group</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-4">
                                <label for="units" class="form-label"><i class="fas fa-vial"></i> Units Required</label>
                                <input type="number" class="form-control form-control-lg" id="units" name="units" placeholder="1-10 units" min="1" max="10" required style="border-radius: 10px;" autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="hospital" class="form-label"><i class="fas fa-hospital"></i> Hospital Name</label>
                        <input type="text" class="form-control form-control-lg" id="hospital" name="hospital" placeholder="Enter hospital name" required style="border-radius: 10px;" autocomplete="off">
                    </div>

                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-lg fw-bold" style="background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%); color: white; border-radius: 10px;">
                            <i class="fas fa-check-circle"></i> Submit Request
                        </button>
                        <a href="/view_request" class="btn btn-lg" style="background: #95a5a6; color: white; border-radius: 10px; text-decoration: none;">
                            <i class="fas fa-eye"></i> View All Requests
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
